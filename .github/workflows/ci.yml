name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-ai:
    name: Python AI service
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: services/ai/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ eval/ -v --tb=short
      - run: pip install ruff && ruff check app/ tests/ eval/ || true

  web:
    name: Next.js frontend
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx next lint
      - run: NEXT_TELEMETRY_DISABLED=1 npx next build

  go-services:
    name: Go backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Verify modules
        run: |
          if [ -f go.mod ]; then go mod verify; fi
          for d in services/*/; do
            if [ -f "$d/go.mod" ]; then (cd "$d" && go mod verify) ; fi
          done
          for d in adapters/*/; do
            if [ -f "$d/go.mod" ]; then (cd "$d" && go mod verify) ; fi
          done
      - name: Compile-check all Go modules
        run: |
          set -e
          for d in services/*/  adapters/*/; do
            if [ -f "$d/go.mod" ]; then
              echo "::group::go build $d"
              (cd "$d" && go build ./...)
              echo "::endgroup::"
            fi
          done
      - name: Run Go tests
        run: |
          for d in services/*/  adapters/*/; do
            if [ -f "$d/go.mod" ]; then
              echo "::group::go test $d"
              (cd "$d" && go test ./... || echo "::warning::tests failed in $d")
              echo "::endgroup::"
            fi
          done

  migrations:
    name: Postgres migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: civic, POSTGRES_PASSWORD: civic, POSTGRES_DB: civic_intelligence }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U civic -d civic_intelligence"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply all migrations in order
        env:
          PGPASSWORD: civic
        run: |
          for f in $(ls infrastructure/postgres/migrations/*.up.sql | sort); do
            echo "=> $f"
            psql -h localhost -U civic -d civic_intelligence -1 -f "$f"
          done
      - name: Verify schemas exist
        env: { PGPASSWORD: civic }
        run: |
          psql -h localhost -U civic -d civic_intelligence -tA -c "
            SELECT schema_name FROM information_schema.schemata
            WHERE schema_name IN ('legislation','ingestion','documents','evidence','intelligence','notifications','identity','search','audit')
            ORDER BY schema_name;
          "

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'   # informational for now; tighten once baseline is set
          format: sarif
          output: trivy-results.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: trivy-results.sarif }

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: ai,   dockerfile: infrastructure/docker/Dockerfile.python-ai }
          - { name: web,  dockerfile: infrastructure/docker/Dockerfile.web }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: civic-intelligence/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
