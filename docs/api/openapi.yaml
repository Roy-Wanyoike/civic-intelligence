openapi: 3.1.0
info:
  title: Civic Intelligence — Citizen API
  version: 0.1.0
  description: |
    Evidence-grounded API for Kenyan legislation, regulations, and civic activity.

    **Architectural rule:** Every factual claim returned by the API carries
    citations. Responses that could not be fully verified are flagged.

  license: { name: MIT, url: https://github.com/Roy-Wanyoike/civic-intelligence/blob/main/LICENSE }
  contact: { url: https://github.com/Roy-Wanyoike/civic-intelligence }

servers:
  - url: http://localhost:9000/api/v1
    description: Local dev (BFF)
  - url: https://api.civicintelligence.dev/api/v1
    description: Production (placeholder)

tags:
  - name: meta
  - name: bills
  - name: acts
  - name: policies
  - name: terminology
  - name: search
  - name: feed
  - name: briefing
  - name: trending
  - name: what-changed
  - name: people
  - name: committees
  - name: institutions
  - name: constitution
  - name: governments
  - name: transitions
  - name: scenarios
  - name: debt
  - name: loans
  - name: grants
  - name: trust
  - name: evidence
  - name: claims
  - name: contradictions
  - name: sources
  - name: corrections
  - name: subscriptions
  - name: notifications
  - name: qa
  - name: sponsor
  - name: operational
  - name: topics

paths:
  /healthz:
    get:
      tags: [meta]
      summary: Liveness probe
      responses:
        '200': { $ref: '#/components/responses/Health' }
  /readyz:
    get:
      tags: [meta]
      summary: Readiness probe
      responses:
        '200': { $ref: '#/components/responses/Health' }

  /bills:
    get:
      tags: [bills]
      summary: List Bills
      description: |
        Returns the current Bills list from the Kenya Law adapter
        (new.kenyalaw.org/bills/). When the live crawl fails (network
        error, 403, timeout, sandbox IP block), the API falls back to a
        comprehensive seed Bills slice and returns 200 with `degraded:
        true` and `source: "seed"` instead of 503 — keeping the API
        contract intact for the 14-country smoke tests + the frontend
        mock layer (issue #265).
      parameters:
        - { in: query, name: page,        schema: { type: integer, default: 1, minimum: 1 } }
        - { in: query, name: page_size,    schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
        - { in: query, name: status,      schema: { type: string, enum: [in_progress, enacted, withdrawn, rejected, lapsed] } }
        - { in: query, name: house,       schema: { type: string } }
        - { in: query, name: topic,       schema: { type: string } }
        - { in: query, name: q,           schema: { type: string } }
      responses:
        '200':
          description: Page of Bills
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Bill' } }
                  total:    { type: integer }
                  page:      { type: integer }
                  page_size: { type: integer }
                  source:   { type: string, enum: [live, seed], description: '`live` when sourced from new.kenyalaw.org; `seed` when the live crawl failed and the API fell back to the seed Bills (issue #265)' }
                  degraded: { type: boolean, description: 'true when `source` is `seed` (upstream crawl failed); false when live data was returned' }
                  country:  { type: string, description: 'ISO-3166-1 alpha-2 country code echoed from the X-Civic-Country header (default KE)' }

  /bills/{id}:
    get:
      tags: [bills]
      summary: Get a Bill
      description: |
        Returns a single Bill by its source ID. The handler re-discovers
        the current Bills list from the Kenya Law adapter to locate the
        requested Bill's URL, then fetches + parses the detail page. When
        the live crawl fails (issue #265), the handler falls back to the
        seed Bills and returns 200 with `source: "seed"` + `degraded:
        true` when the requested ID is present in the seed slice —
        otherwise 404.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The Bill
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Bill'
                  - type: object
                    properties:
                      source:   { type: string, enum: [live, seed], description: '`live` when sourced from new.kenyalaw.org; `seed` when the live crawl failed and the seed data was used (issue #265)' }
                      degraded: { type: boolean, description: 'true when `source` is `seed` (upstream crawl failed); false when live data was returned' }
        '404': { $ref: '#/components/responses/NotFound' }

  /bills/{id}/timeline:
    get:
      tags: [bills]
      summary: Get verified timeline events for a Bill
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Timeline events (oldest first; undated events last)
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: { type: array, items: { $ref: '#/components/schemas/BillEvent' } }

  /bills/{id}/versions:
    get:
      tags: [bills]
      summary: List immutable Bill versions
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Versions (newest first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions: { type: array, items: { $ref: '#/components/schemas/BillVersion' } }

  /bills/{id}/changes:
    get:
      tags: [bills]
      summary: Get the change log between Bill versions
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Change log
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes:
                    type: array
                    items:
                      type: object
                      properties:
                        version: { type: integer }
                        changed_at: { type: string, format: date-time }
                        summary: { type: string }
                        diff_url: { type: string }

  /bills/{id}/summary:
    get:
      tags: [bills]
      summary: Get the AI-generated plain-language summary (validated)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Validated summary
          content: { application/json: { schema: { $ref: '#/components/schemas/BillSummary' } } }

  /bills/{id}/follow:
    post:
      tags: [bills]
      summary: Follow a Bill to receive notifications on verified changes
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Followed
          content: { application/json: { schema: { type: object, properties: { followed: { type: boolean } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /follow:
    post:
      tags: [subscriptions]
      summary: Legacy single-shot follow endpoint (kept for backward compat)
      description: |
        The legacy /follow endpoint creates a subscription for the
        authenticated user. New callers should use the per-entity
        `/acts/{id}/follow` or `/subscriptions` endpoints instead. This
        endpoint is preserved so existing clients do not break during the
        migration window (issue #110).
      responses:
        '200':
          description: Followed
          content: { application/json: { schema: { type: object, properties: { followed: { type: boolean } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /questions:
    post:
      tags: [qa]
      summary: Ask a civic question (non-streaming)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:        { type: string, minLength: 1, maxLength: 1000 }
                bill_id:     { type: string, format: uuid }
                country:     { type: string, default: KE }
                impact_lens:
                  type: string
                  enum: [citizen, student, small_business, employee, farmer, driver, tenant, homeowner, employer, digital_worker]
      responses:
        '200':
          description: Validated AI response with citations
          content: { application/json: { schema: { $ref: '#/components/schemas/AIResponse' } } }

  /search:
    get:
      tags: [search]
      summary: Hybrid search across Bills, Acts, regulations, Hansard, etc.
      parameters:
        - { in: query, name: q,         required: true, schema: { type: string } }
        - { in: query, name: kind,      schema: { type: string, enum: [bill, act, regulation, hansard, committee_report, order_paper, gazette] } }
        - { in: query, name: page,      schema: { type: integer, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SearchResult' } }
                  total: { type: integer }

  /briefing:
    get:
      tags: [briefing]
      summary: Get the daily civic brief
      parameters:
        - { in: query, name: date, schema: { type: string, format: date } }
      responses:
        '200':
          description: Daily briefing
          content: { application/json: { schema: { $ref: '#/components/schemas/DailyBriefing' } } }

  /people/{id}:
    get:
      tags: [people]
      summary: Get a person (MP, Senator, official)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Person, content: { application/json: { schema: { $ref: '#/components/schemas/Person' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /committees/{id}:
    get:
      tags: [committees]
      summary: Get a committee
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Committee, content: { application/json: { schema: { $ref: '#/components/schemas/Committee' } } } }

  /institutions/{id}:
    get:
      tags: [institutions]
      summary: Get an institution
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Institution, content: { application/json: { schema: { $ref: '#/components/schemas/Institution' } } } }

  /trending:
    get:
      tags: [trending]
      summary: Trending Bills and topics (recently enacted + approaching final stage)
      description: |
        Returns the current trending Bills (recently published, hot, and
        approaching final stage) sourced from the Kenya Law adapter's
        DiscoverBills crawl. When the live crawl fails (issue #265), the
        handler falls back to the seed Bills and returns 200 with `source:
        "seed"` + `degraded: true` so the trending carousel still renders
        for sandboxed CI + upstream outages.
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 10, minimum: 1, maximum: 50 } }
      responses:
        '200':
          description: Trending items
          content:
            application/json:
              schema:
                type: object
                properties:
                  recently_published: { type: array, items: { $ref: '#/components/schemas/Bill' } }
                  hot:                { type: array, items: { $ref: '#/components/schemas/Bill' } }
                  approaching_final:  { type: array, items: { $ref: '#/components/schemas/Bill' } }
                  total_bills:        { type: integer }
                  source:             { type: string, enum: [live, seed], description: '`live` when sourced from new.kenyalaw.org; `seed` when the live crawl failed and the seed Bills were used (issue #265)' }
                  degraded:           { type: boolean, description: 'true when `source` is `seed` (upstream crawl failed); false when live data was returned' }

  /terminology:
    get:
      tags: [terminology]
      summary: List all parliamentary terms with plain-language explanations
      responses:
        '200':
          description: Parliamentary terms
          content:
            application/json:
              schema:
                type: object
                properties:
                  terms:
                    type: array
                    items:
                      type: object
                      properties:
                        term: { type: string }
                        explanation: { type: string }
                        source_url: { type: string, nullable: true }

  /terminology/{term}:
    get:
      tags: [terminology]
      summary: Get a single parliamentary term with its plain-language explanation
      parameters:
        - { in: path, name: term, required: true, schema: { type: string } }
      responses:
        '200':
          description: The term
          content:
            application/json:
              schema:
                type: object
                properties:
                  term: { type: string }
                  explanation: { type: string }
                  source_url: { type: string, nullable: true }
        '404': { $ref: '#/components/responses/NotFound' }

  /feed:
    get:
      tags: [feed]
      summary: Civic activity feed
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Feed items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SearchResult' } }
                  total: { type: integer }

  /what-changed:
    get:
      tags: [what-changed]
      summary: Proactive civic change feed (diffs since the caller's last visit)
      parameters:
        - { in: query, name: since, schema: { type: string, format: date-time } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: Changes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SearchResult' } }

  # ---- Legislation: Acts + post-assent lifecycle (issue #116, #193) ----

  /acts:
    get:
      tags: [acts]
      summary: List Acts of Parliament
      parameters:
        - { in: query, name: page,        schema: { type: integer, default: 1, minimum: 1 } }
        - { in: query, name: page_size,   schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
        - { in: query, name: status,      schema: { type: string, enum: [in_force, amended, repealed, not_commenced] } }
        - { in: query, name: q,           schema: { type: string } }
      responses:
        '200':
          description: Page of Acts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Act' } }
                  total: { type: integer }
                  page: { type: integer }
                  page_size: { type: integer }

  /acts/{id}:
    get:
      tags: [acts]
      summary: Get an Act of Parliament
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: The Act
          content: { application/json: { schema: { $ref: '#/components/schemas/Act' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /acts/{id}/audit:
    get:
      tags: [acts]
      summary: Full lifecycle audit for an Act (assent, publication, commencement, regulations, amendments, court, repeal)
      description: |
        Missing records are reported as `NOT_VERIFIED`, never as "never happened".
        The platform does not infer absence (Spec section 16, 43).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Lifecycle audit
          content: { application/json: { schema: { $ref: '#/components/schemas/ActAudit' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /acts/{id}/events:
    get:
      tags: [acts]
      summary: Post-assent events (commencement, regulations, amendments, court challenges, judicial decisions)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Post-assent events
          content:
            application/json:
              schema:
                type: object
                properties:
                  act_id: { type: string }
                  events: { type: array, items: { $ref: '#/components/schemas/PostAssentEvent' } }
                  count: { type: integer }
                  disclaimer: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /acts/{id}/follow:
    post:
      tags: [acts]
      summary: Follow a Law — flagship experience (issue #193)
      description: |
        Creates a real persisted subscription. The caller receives notifications
        when authoritative evidence indicates this Act changed (commencement,
        regulations, implementation, amendments, court cases, government notices,
        institutional actions, related Bills).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Followed
          content:
            application/json:
              schema:
                type: object
                properties:
                  followed: { type: boolean }
                  act_id: { type: string }
                  subscription_id: { type: string }
                  monitors: { type: array, items: { type: string } }
                  disclaimer: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /acts/{id}/lineage:
    get:
      tags: [acts]
      summary: Full legal lineage for an Act
      description: |
        Bill → Parliamentary journey → Presidential Assent → Act publication →
        Commencement → Regulations → Amendments → Court decisions → Current status.
        Each step is independently sourced. Missing steps are `NOT_VERIFIED`,
        never inferred (Spec section 20).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Lineage chain
          content:
            application/json:
              schema:
                type: object
                properties:
                  act_id: { type: string }
                  lineage:
                    type: array
                    items:
                      type: object
                      properties:
                        step: { type: string }
                        title: { type: string }
                        description: { type: string }
                        status: { type: string, enum: [VERIFIED, NOT_VERIFIED] }
                  disclaimer: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /policies:
    get:
      tags: [policies]
      summary: List government policy documents
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: Policy documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Policy' } }
                  total: { type: integer }

  /topics:
    get:
      tags: [topics]
      summary: List civic topics (Health, Education, Finance, …)
      description: |
        Returns the list of seed civic topics for the resolved country scope.
        Each topic carries the count of seed Bills, Acts, and People
        associated with it — enough for the frontend Topics page
        (apps/web/src/app/topics/page.tsx) to render a lightweight index.

        Country scope is resolved by the standard middleware chain:
        `X-Civic-Country` header → `?country=` query → `KE` default.
        `ALL` (GlobalCountry) returns the seed set for every country that
        has topics. Only Kenya ships seed topics today; other countries
        return an empty list (200, not 404) so the Topics page degrades
        gracefully with an empty-state UI.
      parameters:
        - { in: header, name: X-Civic-Country, required: false, schema: { type: string, enum: [KE, UG, TZ, GH, NG, ZA, RW, ZM, SN, EG, MA, CD, ET, MW, ALL] }, description: 'Country scope; defaults to KE' }
      responses:
        '200':
          description: List of civic topics
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Topic' } }
                  total: { type: integer }
                  country: { type: string, example: KE }
                  source: { type: string, example: kenya_seed }
                  note: { type: string }

  /topics/{id}:
    get:
      tags: [topics]
      summary: Get a topic with its associated Bills, Acts, and People
      description: |
        Returns the topic plus the concrete Bills / Acts / People slices
        associated with it. Every associated entry carries a `source_url`
        so the citizen can verify the reference on the primary source's
        website (kenyalaw.org, parliament.go.ke).

        Returns 404 when the supplied ID does not match any seed topic,
        or when the resolved country scope does not have seed topics for
        the requested ID (e.g. a Uganda-scoped request asking for a
        Kenyan topic returns 404).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string }, description: 'Topic ID (kebab-case, e.g. "health", "education", "finance")' }
        - { in: header, name: X-Civic-Country, required: false, schema: { type: string }, description: 'Country scope; defaults to KE' }
      responses:
        '200':
          description: Topic detail with associated Bills, Acts, and People
          content:
            application/json:
              schema:
                type: object
                properties:
                  topic: { $ref: '#/components/schemas/Topic' }
                  bills: { type: array, items: { $ref: '#/components/schemas/TopicBill' } }
                  acts: { type: array, items: { $ref: '#/components/schemas/TopicAct' } }
                  people: { type: array, items: { $ref: '#/components/schemas/TopicPerson' } }
                  country: { type: string, example: KE }
                  source: { type: string, example: kenya_seed }
                  note: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---- Constitution + Government + Transitions ----

  /constitution:
    get:
      tags: [constitution]
      summary: Get the Constitution metadata
      description: |
        The Constitution is authoritative source material. The platform does
        NOT reinterpret constitutional text. Response carries
        `reality_layer: "FACT"`.
      responses:
        '200':
          description: Constitution metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  constitution: { $ref: '#/components/schemas/Constitution' }
                  reality_layer: { type: string, enum: [FACT] }
                  disclaimer: { type: string }

  /constitution/articles:
    get:
      tags: [constitution]
      summary: List Constitution chapters + articles (issue #212)
      description: |
        Returns the curated chapter + article tree sourced from the
        kenya_seed package. Every chapter carries at least one article.
        Response carries `reality_layer: "FACT"` to signal the
        Constitution is authoritative source material.
      responses:
        '200':
          description: Chapters + articles tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  chapters: { type: array, items: { $ref: '#/components/schemas/ConstitutionChapter' } }
                  count: { type: integer }
                  reality_layer: { type: string, enum: [FACT] }
                  disclaimer: { type: string }

  /constitution/articles/{id}:
    get:
      tags: [constitution]
      summary: Get a single Constitution article by stable ID (issue #212)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Constitution article
          content:
            application/json:
              schema:
                type: object
                properties:
                  article: { $ref: '#/components/schemas/ConstitutionArticle' }
                  reality_layer: { type: string, enum: [FACT] }
                  disclaimer: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /governments:
    get:
      tags: [governments]
      summary: List administrations (most recent first)
      responses:
        '200':
          description: Administrations
          content:
            application/json:
              schema:
                type: object
                properties:
                  administrations: { type: array, items: { $ref: '#/components/schemas/Administration' } }
                  count: { type: integer }

  /countries:
    get:
      tags: [governments]
      summary: List supported countries
      description: |
        Returns metadata for every country adapter registered with the
        central registry (adapters/registry). The list is sorted by ISO
        3166-1 alpha-2 code. The frontend Government Selector uses this
        endpoint to render its country dropdown.

        Adding a new country? Register it in adapters/registry (see
        CONTRIBUTING.md "Adding a New Country") and it shows up here
        automatically — no change to the OpenAPI spec is required.
      responses:
        '200':
          description: Supported countries
          content:
            application/json:
              schema:
                type: object
                properties:
                  countries:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, description: 'ISO 3166-1 alpha-2 country code (e.g. "KE")' }
                        name: { type: string, description: 'Human-readable country name' }
                        flag_emoji: { type: string, description: 'Unicode flag emoji' }
                        parliament_name: { type: string, description: 'Name of the national legislature' }
                        legislature_type: { type: string, enum: [unicameral, bicameral] }
                  count: { type: integer }
                  source_registry: { type: string, description: 'Name of the Go package backing the response' }

  /governments/{id}:
    get:
      tags: [governments]
      summary: Get an administration with its president and terms
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Administration detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  administration: { $ref: '#/components/schemas/Administration' }
                  president: { $ref: '#/components/schemas/President' }
                  terms: { type: array, items: { $ref: '#/components/schemas/PresidentialTerm' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /governments/{id}/terms:
    get:
      tags: [governments]
      summary: List the presidential terms for an administration
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Terms
          content:
            application/json:
              schema:
                type: object
                properties:
                  administration_id: { type: string }
                  terms: { type: array, items: { $ref: '#/components/schemas/PresidentialTerm' } }
                  count: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

  /transitions:
    get:
      tags: [transitions]
      summary: List government transitions (outgoing → incoming president)
      responses:
        '200':
          description: Transitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  transitions: { type: array, items: { $ref: '#/components/schemas/GovernmentTransition' } }
                  count: { type: integer }

  # ---- Scenarios (Phase 18 simulation) ----

  /scenarios:
    get:
      tags: [scenarios]
      summary: List scenarios
      description: |
        Every response carries an explicit `reality_layer` tag so HYPOTHETICAL
        outputs cannot be confused with observed civic facts.
      responses:
        '200':
          description: Scenarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenarios: { type: array, items: { $ref: '#/components/schemas/Scenario' } }
                  count: { type: integer }
                  disclaimer: { type: string }
    post:
      tags: [scenarios]
      summary: Create a scenario
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Scenario' }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Scenario' } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /scenarios/compare:
    post:
      tags: [scenarios]
      summary: Compare two or more scenarios side by side
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario_ids]
              properties:
                scenario_ids: { type: array, items: { type: string }, minItems: 2 }
      responses:
        '200':
          description: Comparison
          content: { application/json: { schema: { $ref: '#/components/schemas/ScenarioComparison' } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /scenarios/{id}:
    get:
      tags: [scenarios]
      summary: Get a scenario
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Scenario detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenario: { $ref: '#/components/schemas/Scenario' }
                  reality_layer: { type: string, enum: [FACT, OBSERVED, HYPOTHETICAL, MODELED, UNKNOWN] }
                  disclaimer: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [scenarios]
      summary: Validate / Run / Replay a scenario (selected via `action` query param)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - in: query
          name: action
          required: true
          schema: { type: string, enum: [validate, run, replay] }
        - { in: query, name: seed, schema: { type: integer, description: 'Run reproducibility seed' } }
      responses:
        '200':
          description: Action result
          content:
            application/json:
              schema:
                type: object
                properties:
                  run: { $ref: '#/components/schemas/SimulationRun' }
                  reality_layer: { type: string, enum: [MODELED, HYPOTHETICAL] }
                  disclaimer: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scenarios/{id}/assumptions:
    get:
      tags: [scenarios]
      summary: Get a scenario's assumptions
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Assumptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  assumptions: { type: array, items: { $ref: '#/components/schemas/ScenarioAssumption' } }
                  count: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

  /scenarios/{id}/evidence:
    get:
      tags: [scenarios]
      summary: Get a scenario's source evidence + baseline evidence + assumption evidence count
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Evidence
          content:
            application/json:
              schema:
                type: object
                properties:
                  source_evidence: { type: array, items: { $ref: '#/components/schemas/EvidenceRef' } }
                  baseline_evidence: { type: array, items: { $ref: '#/components/schemas/EvidenceRef' } }
                  assumption_evidence_count: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

  /scenarios/{id}/results:
    get:
      tags: [scenarios]
      summary: Get a scenario's completed run results
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        run_id: { type: string }
                        completed_at: { type: string, format: date-time }
                        duration: { type: string }
                        summary: { type: object }
                  count: { type: integer }
                  reality_layer: { type: string, enum: [MODELED] }
                  disclaimer: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /scenarios/{id}/timeline:
    get:
      tags: [scenarios]
      summary: Get a scenario's timeline (OBSERVED / ASSUMED / MODELED / UNKNOWN labels)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Timeline
          content:
            application/json:
              schema:
                type: object
                properties:
                  timeline:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp: { type: string, format: date }
                        label: { type: string, enum: [OBSERVED, ASSUMED, MODELED, UNKNOWN] }
                        title: { type: string }
                        description: { type: string }
                  disclaimer: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /scenarios/{id}/methodology:
    get:
      tags: [scenarios]
      summary: Get a scenario's methodology + declared model limitations (Gate E)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Methodology
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenario_id: { type: string }
                  methodology: { $ref: '#/components/schemas/Methodology' }
                  model_id: { type: string }
                  model_version: { type: string }
                  limitations: { type: array, items: { type: string } }
                  reality_layer: { type: string, enum: [HYPOTHETICAL] }
                  disclaimer: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---- Public Debt & Borrowing Intelligence ----

  /debt:
    get:
      tags: [debt]
      summary: National debt dashboard (latest CBK snapshot + debt service + debt-to-GDP)
      description: |
        The platform never computes a "best borrower" or political performance
        score. Every figure is an immutable observation; changes in debt stock
        can reflect exchange-rate movements, valuation changes, repayments,
        refinancing, arrears, adjustments, and disbursement timing — NOT just new
        borrowing.
      responses:
        '200':
          description: Dashboard
          content: { application/json: { schema: { $ref: '#/components/schemas/DebtDashboard' } } }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /debt/loans:
    get:
      tags: [debt, loans]
      summary: Borrowing register
      description: |
        Each agreement carries an `attribution_warning` field when its
        `GovernmentAdministrationID` does not correspond to the administration
        in power on `ContractDate` (issue #221). The platform never rejects
        records — it surfaces the discrepancy for human review (Spec section 28).
      responses:
        '200':
          description: Borrowing agreements
          content:
            application/json:
              schema:
                type: object
                properties:
                  borrowing_agreements: { type: array, items: { $ref: '#/components/schemas/BorrowingAgreement' } }
                  count: { type: integer }
                  disclaimer: { type: string }

  /debt/timeline:
    get:
      tags: [debt]
      summary: Debt-stock observations (chronological; immutable per Spec section 9)
      description: |
        Each point is an immutable observation. The trend line should NOT be
        interpreted as a causal attribution of borrowing to any individual
        president. Government transition dates overlay the chart; users can
        correlate visually without the platform implying causation.
      responses:
        '200':
          description: Timeline
          content:
            application/json:
              schema:
                type: object
                properties:
                  country_code: { type: string }
                  points: { type: array, items: { $ref: '#/components/schemas/DebtTrendPoint' } }
                  disclaimer: { type: string }

  /debt/governments/{id}:
    get:
      tags: [debt, governments]
      summary: Per-administration debt summary
      description: |
        The canonical `NO_POLITICAL_PERFORMANCE_SCORE` disclaimer is appended to
        every per-administration summary (issue #222).
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Government debt summary
          content: { application/json: { schema: { $ref: '#/components/schemas/GovernmentDebtSummary' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /debt/legislatures/{id}:
    get:
      tags: [debt]
      summary: Per-legislature debt summary (GAP-19-1, Spec section 19)
      description: |
        Surfaces debt at beginning/end, new borrowing (CONTRACTED_DURING),
        domestic/external split, disbursements, repayments, debt service,
        and outstanding obligations. The legal borrower is the Republic of
        Kenya — the platform never attributes borrowing to a Parliament or
        its members (Spec section 35). The canonical
        `NO_POLITICAL_PERFORMANCE_SCORE` disclaimer is appended to every
        per-legislature summary.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Legislature debt summary
          content: { application/json: { schema: { $ref: '#/components/schemas/LegislatureDebtSummary' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /graph:
    get:
      tags: [graph]
      summary: Civic Knowledge Graph summary
      description: |
        The Civic Knowledge Graph is the platform's signature differentiator:
        a visual relationship explorer that traces how Bills, Acts,
        Institutions, People, Constitution Articles, Administrations, and
        Government borrowing are connected. The bare `/graph` endpoint
        returns a metadata summary (total node + edge counts broken down
        by type) tagged with `reality_layer: FACT` — every node carries
        the same `source_url` as the underlying entity so a citizen can
        verify any relationship against the authoritative Kenya Law / CBK /
        Treasury source.
      responses:
        '200':
          description: Graph summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_nodes: { type: integer }
                  total_edges: { type: integer }
                  node_types: { type: object, additionalProperties: { type: integer } }
                  edge_types: { type: object, additionalProperties: { type: integer } }
                  reality_layer: { type: string, example: FACT }
                  disclaimer: { type: string }

  /graph/nodes:
    get:
      tags: [graph]
      summary: List graph nodes (optionally filtered by type)
      parameters:
        - { in: query, name: type, schema: { type: string, enum: [bill, act, institution, person, constitution_article, administration, presidential_term, legislature, committee, creditor, borrowing_agreement] } }
        - { in: query, name: limit, schema: { type: integer, default: 20, maximum: 200 } }
        - { in: query, name: q, schema: { type: string }, description: Case-insensitive label substring filter }
      responses:
        '200':
          description: Graph nodes
          content: { application/json: { schema: { $ref: '#/components/schemas/GraphResponse' } } }

  /graph/node/{id}:
    get:
      tags: [graph]
      summary: Get a single node with its direct relationships (depth=1)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Node + direct neighbours
          content: { application/json: { schema: { $ref: '#/components/schemas/GraphResponse' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /graph/relationships:
    get:
      tags: [graph]
      summary: Get relationships from a node up to N hops deep (BFS)
      description: |
        Depth is clamped to [1, 3] to bound response size. The response
        uses the standard `GraphResponse` shape with `metadata.depth`
        reporting the requested (clamped) depth.
      parameters:
        - { in: query, name: id, required: true, schema: { type: string } }
        - { in: query, name: depth, schema: { type: integer, default: 1, minimum: 1, maximum: 3 } }
      responses:
        '200':
          description: Subgraph reachable within the requested depth
          content: { application/json: { schema: { $ref: '#/components/schemas/GraphResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /graph/search:
    get:
      tags: [graph]
      summary: Search graph nodes by label / properties
      parameters:
        - { in: query, name: q, required: true, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, default: 20, maximum: 200 } }
      responses:
        '200':
          description: Matching nodes (depth=0)
          content: { application/json: { schema: { $ref: '#/components/schemas/GraphResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /graph/paths:
    get:
      tags: [graph]
      summary: Find shortest path between two nodes (BFS, undirected)
      description: |
        Returns the shortest connection between two nodes. The graph is
        traversed as undirected so a citizen asking "how is this Bill
        connected to this President" gets the answer regardless of edge
        direction. Returns 404 if no path exists.
      parameters:
        - { in: query, name: from, required: true, schema: { type: string } }
        - { in: query, name: to, required: true, schema: { type: string } }
      responses:
        '200':
          description: Path nodes + edges
          content: { application/json: { schema: { $ref: '#/components/schemas/GraphResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /loans:
    get:
      tags: [loans]
      summary: Sovereign loans tracker (list)
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: Loans
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/BorrowingAgreement' } }
                  total: { type: integer }

  /loans/{id}:
    get:
      tags: [loans]
      summary: Sovereign loan detail
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Loan
          content: { application/json: { schema: { $ref: '#/components/schemas/BorrowingAgreement' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /grants:
    get:
      tags: [grants]
      summary: Grants received by the government (list)
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: page_size, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: Grants
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Grant' } }
                  total: { type: integer }

  /grants/{id}:
    get:
      tags: [grants]
      summary: Grant detail
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Grant
          content: { application/json: { schema: { $ref: '#/components/schemas/Grant' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---- Trust, Evidence, Claims, Contradictions, Sources ----

  /provenance/{entity_type}/{id}:
    get:
      tags: [trust, evidence]
      summary: Get the full evidence chain for an entity
      parameters:
        - { in: path, name: entity_type, required: true, schema: { type: string, enum: [bill, act, regulation, claim, evidence, source, policy] } }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Provenance
          content:
            application/json:
              schema:
                type: object
                properties:
                  entity_type: { type: string }
                  entity_id: { type: string }
                  claims: { type: array, items: { $ref: '#/components/schemas/Claim' } }
                  evidence: { type: array, items: { $ref: '#/components/schemas/Evidence' } }
                  sources: { type: array, items: { $ref: '#/components/schemas/Source' } }

  /evidence/{id}:
    get:
      tags: [evidence]
      summary: Evidence detail
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Evidence
          content: { application/json: { schema: { $ref: '#/components/schemas/Evidence' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /claims/{id}/evidence:
    get:
      tags: [claims]
      summary: Get a claim with its supporting evidence
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Claim + evidence
          content:
            application/json:
              schema:
                type: object
                properties:
                  claim: { $ref: '#/components/schemas/Claim' }
                  evidence: { type: array, items: { $ref: '#/components/schemas/Evidence' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /contradictions:
    get:
      tags: [contradictions]
      summary: List active source conflicts
      responses:
        '200':
          description: Contradictions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Contradiction' } }
                  total: { type: integer }

  /sources:
    get:
      tags: [sources]
      summary: List trust sources
      responses:
        '200':
          description: Sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Source' } }
                  total: { type: integer }

  /sources/{id}:
    get:
      tags: [sources]
      summary: Source detail with health
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Source
          content: { application/json: { schema: { $ref: '#/components/schemas/Source' } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---- Corrections, Subscriptions, Notifications ----

  /corrections:
    post:
      tags: [corrections]
      summary: Submit a correction request (anonymous submitters must provide submitted_email)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectionRequest' }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Correction' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [corrections]
      summary: List corrections (admin scope - user:admin or evidence:write)
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending, in_review, accepted, rejected, superseded] } }
      responses:
        '200':
          description: Corrections
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Correction' } }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /corrections/{id}:
    get:
      tags: [corrections]
      summary: Correction detail (admin scope)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Correction
          content: { application/json: { schema: { $ref: '#/components/schemas/Correction' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /subscriptions:
    post:
      tags: [subscriptions]
      summary: Follow an entity (bill, committee, topic, institution, person)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entity_type, entity_id]
              properties:
                entity_type: { type: string, enum: [bill, committee, topic, institution, person] }
                entity_id: { type: string }
      responses:
        '201':
          description: Followed
          content: { application/json: { schema: { $ref: '#/components/schemas/Follow' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [subscriptions]
      summary: List the caller's follows
      parameters:
        - { in: query, name: entity_type, schema: { type: string, enum: [bill, committee, topic, institution, person] } }
      responses:
        '200':
          description: Follows
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Follow' } }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /subscriptions/{id}:
    delete:
      tags: [subscriptions]
      summary: Unfollow
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '204': { description: Unfollowed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications:
    get:
      tags: [notifications]
      summary: List the caller's notifications
      parameters:
        - { in: query, name: unread, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  total: { type: integer }
                  unread: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/{id}/read:
    post:
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '204': { description: Marked as read }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /questions/stream:
    post:
      tags: [qa]
      summary: Ask a civic question (SSE streaming)
      description: |
        Streams Server-Sent Events as the AI gateway streams tokens. The
        response is validated before being committed to the canonical claim
        store (ADR-0005).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 1000 }
                bill_id: { type: string, format: uuid }
                country: { type: string, default: KE }
                impact_lens:
                  type: string
                  enum: [citizen, student, small_business, employee, farmer, driver, tenant, homeowner, employer, digital_worker]
      responses:
        '200':
          description: SSE stream of validated tokens + citations
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---- Sponsor (payments) ----

  /sponsor/mpesa:
    post:
      tags: [sponsor]
      summary: Initiate an M-Pesa sponsorship
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, amount]
              properties:
                phone: { type: string }
                amount: { type: integer, minimum: 100 }
      responses:
        '200':
          description: STK push initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkout_request_id: { type: string }
                  status: { type: string }

  /sponsor/card:
    post:
      tags: [sponsor]
      summary: Initiate a card sponsorship (Stripe)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, minimum: 100 }
                email: { type: string, format: email }
      responses:
        '200':
          description: Payment intent created
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_secret: { type: string }
                  publishable_key: { type: string }

  /sponsor/mpesa/callback:
    post:
      tags: [sponsor]
      summary: M-Pesa STK push callback receiver
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Acknowledged }

  /sponsor/card/webhook:
    post:
      tags: [sponsor]
      summary: Stripe webhook receiver
      parameters:
        - { in: header, name: Stripe-Signature, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Acknowledged }

  # ---- Operational ----

  /refresh:
    post:
      tags: [operational]
      summary: Trigger adapter re-discovery (called by cron)
      responses:
        '200':
          description: Refresh triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  refreshed_at: { type: string, format: date-time }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC JWT issued by Keycloak (or any standards-compliant OIDC provider).

  schemas:
    Bill:
      type: object
      properties:
        id: { type: string, format: uuid }
        identifier: { type: string, example: 'NA Bill No. 23 of 2024' }
        title: { type: string }
        year: { type: integer }
        sponsor_id: { type: string, nullable: true, description: 'Platform-internal person ID of the primary sponsor (e.g. "person-001"); empty when the sponsor is unknown (issue #282 — the live kenya_law parser does NOT extract the sponsor; only seed Bills carry sponsor_id).' }
        sponsor_name: { type: string, nullable: true, description: 'Display name of the primary sponsor, populated from the sample people slice when sponsor_id is known AND matches a sample MP; empty otherwise (issue #282).' }
        scorecard_url: { type: string, nullable: true, description: 'Platform-internal path to the sponsor\'s MP scorecard page (/api/v1/people/{id}/scorecard). Populated alongside sponsor_name; empty otherwise. The frontend Bill detail page links the sponsor name to this URL (issue #282).' }
        cosponsors:
          type: array
          nullable: true
          description: 'List of cosponsor references (secondary supporters). Empty/omitted when the Bill has no known cosponsors (issue #282).'
          items:
            $ref: '#/components/schemas/SponsorRef'
        house_id: { type: string, format: uuid, nullable: true }
        house_name: { type: string, nullable: true }
        committee_id: { type: string, format: uuid, nullable: true }
        committee_name: { type: string, nullable: true }
        status: { type: string, enum: [in_progress, enacted, withdrawn, rejected, lapsed] }
        current_stage: { type: string, nullable: true, description: 'Stage CODE resolved via adapter' }
        current_stage_simple_explanation: { type: string, nullable: true }
        purpose: { type: string, nullable: true }
        description: { type: string, nullable: true }
        country: { type: string, example: KE }
        topics: { type: array, items: { type: string } }
        citation_count: { type: integer }
        version_count: { type: integer }
        event_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        video_url:
          type: string
          format: uri
          nullable: true
          description: |
            YouTube URL of the plenary sitting in which this Bill was
            discussed (issue #283). Populated by the Hansard crawler's
            `HansardCandidate.VideoURL` field once the ingestion worker
            links a Bill to its most-recent sitting video. When present,
            the frontend renders an inline YouTube embed below the Bill
            title so citizens can watch the actual debate. Omitted when
            no Hansard video is available yet.

    SponsorRef:
      type: object
      description: |
        A lightweight reference to a person in their role as a Bill sponsor
        or cosponsor (issue #282). Carries enough information for the
        frontend to render the sponsor's name + a link to their scorecard
        page without an extra round-trip to /api/v1/people/{id}.

        The scorecard_url is omitted on the wire when the sponsor is not
        in the sample people slice (the seed slice may carry sponsor_ids
        that aren't yet wired to a full scorecard).
      properties:
        person_id: { type: string, description: 'Platform-internal person ID (e.g. "person-001")' }
        name: { type: string, description: 'Display name of the sponsor' }
        scorecard_url: { type: string, nullable: true, description: '/api/v1/people/{id}/scorecard URL; omitted when the sponsor has no scorecard page' }

    BillEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        bill_id: { type: string, format: uuid }
        event_type: { type: string }
        date: { type: string, format: date, nullable: true, description: 'NULL means date unknown' }
        date_is_approximate: { type: boolean }
        house: { type: string, nullable: true }
        description: { type: string }
        source_url: { type: string, nullable: true }
        confidence: { type: string, enum: [high, medium, low, unknown] }
        note: { type: string, nullable: true }

    BillVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        bill_id: { type: string, format: uuid }
        version_no: { type: integer }
        content_hash: { type: string }
        retrieved_at: { type: string, format: date-time }
        source_url: { type: string }
        is_current: { type: boolean }

    BillSummary:
      type: object
      properties:
        bill_id: { type: string, format: uuid }
        short_title: { type: string }
        one_line_summary: { type: string }
        plain_language_explanation: { type: string }
        current_stage_explained: { type: string }
        what_it_would_do: { type: array, items: { type: string } }
        who_it_affects: { type: array, items: { type: string } }
        what_happens_next: { type: array, items: { type: string } }
        citations: { type: array, items: { $ref: '#/components/schemas/Citation' } }
        confidence: { type: string, enum: [high, medium, low, unknown] }
        validated: { type: boolean }
        validation_failures: { type: array, items: { type: string } }

    Citation:
      type: object
      properties:
        document_id: { type: string, format: uuid }
        source_url: { type: string }
        page_number: { type: integer, nullable: true }
        section: { type: string, nullable: true }
        snippet: { type: string }
        source_type: { type: string, enum: [parliament, gazette, kenya_law, hansard, committee_report, order_paper, votes_proceedings] }
        retrieved_at: { type: string, format: date-time }

    AIResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        answer: { type: string }
        claims:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              text: { type: string }
              citations: { type: array, items: { $ref: '#/components/schemas/Citation' } }
              confidence: { type: string, enum: [high, medium, low, unknown] }
        citations: { type: array, items: { $ref: '#/components/schemas/Citation' } }
        validated: { type: boolean }
        validation_status: { type: string, enum: [pending, passed, failed, partial] }
        validation_failures: { type: array, items: { type: string } }
        model: { type: string }
        provider: { type: string }
        latency_ms: { type: integer }

    SearchResult:
      type: object
      properties:
        kind: { type: string, enum: [bill, act, regulation, hansard, committee_report, order_paper, gazette] }
        id: { type: string }
        title: { type: string }
        snippet: { type: string }
        url: { type: string }
        score: { type: number }
        published_at: { type: string, format: date-time, nullable: true }
        source_type: { type: string }

    DailyBriefing:
      type: object
      properties:
        country: { type: string }
        date: { type: string, format: date-time }
        headline: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [new_bill, stage_change, amendment, new_document, enacted, committee] }
              title: { type: string }
              description: { type: string }
              bill_id: { type: string, format: uuid, nullable: true }
              citations: { type: array, items: { $ref: '#/components/schemas/Citation' } }
              significance: { type: string }
              confidence: { type: string, enum: [high, medium, low, unknown] }

    Person:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        primary_role: { type: string }
        institution_id: { type: string, format: uuid, nullable: true }
        country: { type: string }

    MPScorecard:
      type: object
      description: |
        Factual, evidence-backed record of a single MP's parliamentary activity.
        The platform NEVER aggregates these metrics into a composite "performance
        score" or "rating" (rule: NO_POLITICAL_PERFORMANCE_SCORE) — every numeric
        metric is a raw count or rate sourced from official parliamentary records
        (Hansard, Votes and Proceedings, parliament.go.ke).
      properties:
        person_id: { type: string, example: 'person-001' }
        name: { type: string, example: "Kimani Ichung'wah" }
        role: { type: string, example: 'Majority Leader, National Assembly' }
        constituency: { type: string, example: 'Kikuyu' }
        party: { type: string, example: 'UDA' }
        parliamentary_period: { type: string, example: '13th Parliament (2022–present)' }
        photo_url: { type: string, nullable: true, description: 'Optional portrait photo URL — the platform does not fabricate photos.' }

        # Contact info — issue #281. All fields use omitempty so empty
        # values (e.g. for a future MP whose data has not been scraped
        # yet) are omitted from the JSON rather than rendered as empty
        # rows on the frontend. The _note field marks the contact info as
        # seed data pending live scraping from parliament.go.ke.
        email:
          type: string
          format: email
          nullable: true
          description: 'Official parliamentary email (mailto: link on the frontend).'
          example: 'kimani.ichungwah@parliament.go.ke'
        phone:
          type: string
          nullable: true
          description: 'Contact phone, E.164-style (tel: link on the frontend).'
          example: '+254 700 123 456'
        office_address:
          type: string
          nullable: true
          description: 'Physical office address (typically Parliament Buildings).'
          example: 'Parliament Buildings, Parliament Road, Nairobi'
        twitter:
          type: string
          nullable: true
          description: 'Twitter handle including the leading @ — frontend links to twitter.com/@handle.'
          example: '@KimaniIchungwah'
        facebook:
          type: string
          nullable: true
          description: 'Facebook profile path (without the https:// prefix) — frontend links to the full URL.'
          example: 'facebook.com/kimani.ichungwah'
        _note:
          type: string
          nullable: true
          description: |
            Provenance marker attached to the contact fields. Present whenever
            any contact field is non-empty. Marks the contact info as seed
            data pending live scraping from parliament.go.ke — the platform
            does NOT yet scrape parliament.go.ke for contact info.
          example: 'Contact info is seed data pending live scraping from parliament.go.ke'

        attendance_rate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: '0.0–1.0 rate — NOT a performance score.'
        attendance_source_url: { type: string, format: uri }
        bills_sponsored: { type: integer, description: 'Raw count.' }
        bills_sponsored_list:
          type: array
          items: { $ref: '#/components/schemas/ScorecardBillRef' }
        committee_memberships:
          type: array
          items: { $ref: '#/components/schemas/ScorecardCommitteeRef' }
        questions_asked: { type: integer, description: 'Raw count.' }
        votes_recorded: { type: integer, description: 'Raw count.' }
        statements_made: { type: integer, description: 'Raw count.' }
        metrics:
          type: object
          description: 'Per-metric source_url + period — lets a citizen verify each datum.'
        recent_activity:
          type: array
          items: { $ref: '#/components/schemas/ScorecardActivityItem' }
        disclaimer: { type: string, description: 'Editorial posture — rendered verbatim by the frontend.' }
        reality_layer: { type: string, enum: ['FACT'], description: 'Always "FACT".' }
        source_agencies:
          type: array
          items: { type: string }
          description: 'Official source families a citizen can cross-check against.'

    ScorecardBillRef:
      type: object
      properties:
        title: { type: string }
        url: { type: string, description: 'Deep link into the platform.' }
        source_url: { type: string, format: uri, description: 'Link to the official parliamentary record.' }
        house: { type: string, nullable: true, example: 'National Assembly' }

    ScorecardCommitteeRef:
      type: object
      properties:
        name: { type: string }
        role: { type: string, example: 'Chair' }
        source_url: { type: string, format: uri }

    ScorecardActivityItem:
      type: object
      properties:
        kind:
          type: string
          enum: [question, statement, vote, bill_sponsored, committee_meeting]
        date: { type: string, format: date }
        title: { type: string }
        detail: { type: string, nullable: true }
        source_url: { type: string, format: uri }
        source: { type: string }

    Committee:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, nullable: true }
        house_id: { type: string, format: uuid }

    Institution:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [legislature, executive, judiciary, ministry, agency, regulator, county, commission, constitutional_body, independent_office] }
        country: { type: string }

    Act:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        citation: { type: string, example: 'Act No. 23 of 2012' }
        year: { type: integer }
        country: { type: string, example: KE }
        status: { type: string, enum: [in_force, amended, repealed, not_commenced] }
        assent_date: { type: string, format: date, nullable: true }
        publication_date: { type: string, format: date, nullable: true }
        commencement_date: { type: string, format: date, nullable: true }
        description: { type: string, nullable: true }
        source_url: { type: string, nullable: true }
        version_count: { type: integer }
        event_count: { type: integer }

    ActAudit:
      type: object
      properties:
        act_id: { type: string }
        assent_recorded: { type: boolean }
        act_published: { type: boolean }
        act_number: { type: string }
        commencement_notice: { type: boolean }
        regulations_issued: { type: boolean }
        amended: { type: boolean }
        court_challenged: { type: boolean }
        judicial_decision: { type: boolean }
        repealed: { type: boolean }
        current_status: { type: string }
        audit_statuses: { type: array, items: { type: string } }
        data_gaps: { type: array, items: { type: string } }
        disclaimer: { type: string }

    PostAssentEvent:
      type: object
      properties:
        id: { type: string }
        act_id: { type: string }
        event_type: { type: string, enum: [ASSENT, PUBLICATION, COMMENCEMENT, REGULATION, AMENDMENT, COURT_CHALLENGE, JUDICIAL_DECISION, REPEAL] }
        event_date: { type: string, format: date-time }
        title: { type: string }
        description: { type: string }
        source_url: { type: string }

    Policy:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string }
        ministry_id: { type: string, nullable: true }
        ministry_name: { type: string, nullable: true }
        published_at: { type: string, format: date-time }
        source_url: { type: string }
        topics: { type: array, items: { type: string } }

    Topic:
      type: object
      description: |
        A civic topic (e.g. "Health", "Education", "Finance & National
        Planning") shown in the /api/v1/topics list and /topics/{id} detail
        responses. Topic IDs are kebab-case (e.g. "health",
        "defence-foreign-relations"); each topic carries the count of seed
        Bills / Acts / People associated with it.
      properties:
        id: { type: string, example: health }
        name: { type: string, example: Health }
        description: { type: string, description: '1-2 sentence plain-language summary of what the topic covers' }
        bill_count: { type: integer, description: 'Number of seed Bills associated with this topic' }
        act_count: { type: integer, description: 'Number of seed Acts associated with this topic' }
        people_count: { type: integer, description: 'Number of seed People associated with this topic' }
        country: { type: string, example: KE, description: 'ISO 3166-1 alpha-2 country code' }

    TopicBill:
      type: object
      description: |
        A Bill associated with a topic. Trimmed-down view (ID, title,
        house, year, source URL) — enough for the Topics detail page to
        render a clickable list without re-crawling the live adapter.
      properties:
        id: { type: string, example: ke-bill-2026-health }
        title: { type: string, example: 'The Health Bill, 2026' }
        house: { type: string, enum: [National Assembly, Senate] }
        year: { type: integer }
        source_url: { type: string, format: uri }

    TopicAct:
      type: object
      description: An Act associated with a topic.
      properties:
        id: { type: string, example: ke-act-data-protection-2019 }
        title: { type: string, example: 'Data Protection Act, 2019' }
        citation: { type: string, example: 'No. 24 of 2019' }
        source_url: { type: string, format: uri }

    TopicPerson:
      type: object
      description: |
        A Person (MP, official) associated with a topic — typically the
        chair / vice-chair of the corresponding Departmental Committee.
      properties:
        id: { type: string, example: person-001 }
        full_name: { type: string, example: 'Rt. Hon. Moses Wetangula' }
        role: { type: string, example: 'Speaker of the National Assembly' }
        house: { type: string, enum: [National Assembly, Senate, Executive] }

    Constitution:
      type: object
      properties:
        id: { type: string }
        country_code: { type: string, example: KE }
        title: { type: string, example: 'Constitution of Kenya, 2010' }
        promulgated_on: { type: string, format: date }
        source_url: { type: string }
        article_count: { type: integer }

    President:
      type: object
      properties:
        id: { type: string }
        display_name: { type: string }
        country_code: { type: string }
        birth_date: { type: string, format: date, nullable: true }
        death_date: { type: string, format: date, nullable: true }
        source_url: { type: string, nullable: true }

    Administration:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        president_id: { type: string }
        president_name: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true, description: 'NULL means administration is current' }
        is_current: { type: boolean }
        country_code: { type: string }
        source_url: { type: string }

    PresidentialTerm:
      type: object
      properties:
        id: { type: string }
        administration_id: { type: string }
        term_number: { type: integer }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        is_current: { type: boolean }
        source_url: { type: string }

    GovernmentTransition:
      type: object
      properties:
        id: { type: string }
        transition_date: { type: string, format: date }
        outgoing_admin_id: { type: string, nullable: true }
        incoming_admin_id: { type: string }
        outgoing_president: { type: string, nullable: true }
        incoming_president: { type: string }
        source_url: { type: string }

    Scenario:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        title: { type: string }
        description: { type: string }
        reality_layer: { type: string, enum: [FACT, OBSERVED, HYPOTHETICAL, MODELED, UNKNOWN] }
        scenario_type: { type: string }
        status: { type: string, enum: [DRAFT, READY, RUNNING, COMPLETED, FAILED, ARCHIVED] }
        model_id: { type: string }
        model_version: { type: string }
        baseline: { type: object }
        assumptions: { type: array, items: { $ref: '#/components/schemas/ScenarioAssumption' } }
        constraints: { type: array, items: { type: object } }
        variables: { type: array, items: { type: object } }
        time_horizon: { type: object }
        methodology: { $ref: '#/components/schemas/Methodology' }
        source_evidence: { type: array, items: { $ref: '#/components/schemas/EvidenceRef' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ScenarioAssumption:
      type: object
      properties:
        id: { type: string }
        statement: { type: string }
        status: { type: string, enum: [PROPOSED, ACCEPTED, REJECTED, OBSERVED] }
        confidence: { type: string, enum: [high, medium, low, unknown] }
        source_evidence: { type: array, items: { $ref: '#/components/schemas/EvidenceRef' } }

    EvidenceRef:
      type: object
      properties:
        kind: { type: string, enum: [bill, act, regulation, hansard, committee_report, order_paper, gazette, news, journal] }
        ref_id: { type: string }
        url: { type: string }
        retrieved_at: { type: string, format: date-time }

    Methodology:
      type: object
      properties:
        approach: { type: string }
        data_sources: { type: array, items: { type: string } }
        limitations: { type: array, items: { type: string } }
        assumptions: { type: array, items: { type: string } }
        validation_status: { type: string, enum: [pending, passed, failed, partial] }

    SimulationRun:
      type: object
      properties:
        id: { type: string }
        scenario_id: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED, REPLAYED] }
        seed: { type: integer }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        duration: { type: string }
        result_summary: { type: object, nullable: true }
        reality_layer: { type: string, enum: [MODELED, HYPOTHETICAL] }

    ScenarioComparison:
      type: object
      properties:
        scenario_ids: { type: array, items: { type: string } }
        dimensions: { type: array, items: { type: string } }
        matrix:
          type: array
          items:
            type: object
            properties:
              dimension: { type: string }
              values:
                type: array
                items:
                  type: object
                  properties:
                    scenario_id: { type: string }
                    value: { type: string }

    DebtDashboard:
      type: object
      properties:
        country_code: { type: string }
        total_debt_stock: { type: number, nullable: true }
        domestic_debt: { type: number, nullable: true }
        external_debt: { type: number, nullable: true }
        debt_service: { type: number, nullable: true }
        debt_to_gdp: { type: number, nullable: true }
        currency: { type: string, example: KES }
        as_of: { type: string, format: date }
        source_url: { type: string }
        disclaimer: { type: string }

    DebtTrendPoint:
      type: object
      properties:
        date: { type: string, format: date }
        total_debt_stock: { type: number, nullable: true }
        domestic_debt: { type: number, nullable: true }
        external_debt: { type: number, nullable: true }
        source_url: { type: string }

    GovernmentDebtSummary:
      type: object
      properties:
        administration_id: { type: string }
        period: { type: string }
        debt_at_start: { type: number, nullable: true }
        debt_at_end: { type: number, nullable: true }
        new_borrowing: { type: number, nullable: true }
        debt_service: { type: number, nullable: true }
        external_debt: { type: number, nullable: true }
        domestic_debt: { type: number, nullable: true }
        currency: { type: string }
        source_urls: { type: array, items: { type: string } }
        disclaimer: { type: string }

    BorrowingAgreement:
      type: object
      properties:
        id: { type: string }
        country_code: { type: string }
        government_administration_id: { type: string }
        presidential_term_id: { type: string, nullable: true }
        borrower: { type: string }
        creditor_id: { type: string }
        creditor_name: { type: string }
        creditor_category: { type: string }
        instrument_type: { type: string }
        domestic_or_external: { type: string, enum: [DOMESTIC, EXTERNAL] }
        original_amount: { type: number }
        original_currency: { type: string }
        purpose: { type: string }
        sector: { type: string }
        contract_date: { type: string, format: date, nullable: true }
        status: { type: string }
        source_url: { type: string }
        attribution_warning: { type: string, description: "Present when the agreement's GovernmentAdministrationID does not match the administration in power on ContractDate." }

    Grant:
      type: object
      properties:
        id: { type: string }
        country_code: { type: string }
        donor_id: { type: string }
        donor_name: { type: string }
        amount: { type: number }
        currency: { type: string }
        purpose: { type: string }
        sector: { type: string }
        agreement_date: { type: string, format: date, nullable: true }
        status: { type: string }
        source_url: { type: string }

    Claim:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [FACT, EXPLANATION, INFERENCE] }
        text: { type: string }
        authority: { type: string, enum: [PRIMARY_OFFICIAL, OFFICIAL_REPOSITORY, SECONDARY_VERIFIED, UNVERIFIED] }
        confidence: { type: string, enum: [high, medium, low, unknown] }
        citations: { type: array, items: { $ref: '#/components/schemas/Citation' } }

    Evidence:
      type: object
      properties:
        id: { type: string }
        claim_id: { type: string }
        source_url: { type: string }
        snippet: { type: string }
        retrieved_at: { type: string, format: date-time }
        source_type: { type: string, enum: [parliament, gazette, kenya_law, hansard, committee_report, order_paper, votes_proceedings] }

    Contradiction:
      type: object
      properties:
        id: { type: string }
        claim_a_id: { type: string }
        claim_b_id: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, resolved, superseded] }
        detected_at: { type: string, format: date-time }

    Source:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        authority: { type: string, enum: [PRIMARY_OFFICIAL, OFFICIAL_REPOSITORY, SECONDARY_VERIFIED, UNVERIFIED] }
        last_polled_at: { type: string, format: date-time, nullable: true }
        health: { type: string, enum: [healthy, degraded, down, unknown] }
        coverage: { type: string }

    Correction:
      type: object
      properties:
        id: { type: string }
        target_type: { type: string, enum: [bill, act, claim, evidence, source, regulation, policy, person, committee] }
        target_id: { type: string }
        reason: { type: string }
        category: { type: string }
        page_url: { type: string }
        evidence: { type: string }
        previous_state: { type: object, nullable: true }
        corrected_state: { type: object, nullable: true }
        submitted_by: { type: string }
        submitted_email: { type: string }
        reviewed_by: { type: string, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [pending, in_review, accepted, rejected, superseded] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CorrectionRequest:
      type: object
      required: [target_type, target_id, category, reason, page_url]
      properties:
        target_type: { type: string, enum: [bill, act, claim, evidence, source, regulation, policy, person, committee] }
        target_id: { type: string }
        category: { type: string, enum: [wrong_fact, wrong_source, wrong_citation, outdated, incorrect_interpretation, missing_information, conflicting_sources, broken_document] }
        reason: { type: string, minLength: 1 }
        page_url: { type: string, format: uri }
        evidence: { type: string, format: uri }
        submitted_email: { type: string, format: email, description: 'Required for anonymous submissions' }
        corrected_state: { type: object }

    Follow:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        entity_type: { type: string, enum: [bill, committee, topic, institution, person] }
        entity_id: { type: string }
        created_at: { type: string, format: date-time }

    Notification:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        entity_type: { type: string }
        entity_id: { type: string }
        event_type: { type: string, enum: [bill_published, bill_stage_change, bill_amended, bill_assented, new_document, committee_report, public_participation] }
        title: { type: string }
        body: { type: string }
        payload: { type: object }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    GraphNode:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [bill, act, institution, person, constitution_article, administration, presidential_term, legislature, committee, creditor, borrowing_agreement] }
        label: { type: string }
        properties: { type: object, additionalProperties: true }

    GraphEdge:
      type: object
      properties:
        source: { type: string }
        target: { type: string }
        type: { type: string, enum: [ORIGINATES_FROM, SPONSORED_BY, BELONGS_TO, ASSESSED_BY, CITES, ESTABLISHES, GOVERNED_BY, ASSESNTED_BY, BORROWED_BY, CONTRACTED_DURING, MEMBER_OF, LEADS] }
        properties: { type: object, additionalProperties: true }

    GraphResponse:
      type: object
      properties:
        nodes: { type: array, items: { $ref: '#/components/schemas/GraphNode' } }
        edges: { type: array, items: { $ref: '#/components/schemas/GraphEdge' } }
        metadata:
          type: object
          properties:
            total_nodes: { type: integer }
            total_edges: { type: integer }
            depth: { type: integer, description: "Traversal depth (0 = no traversal, 1-3 = BFS hops, edge count = path length)" }

  responses:
    Health:
      description: OK
      content: { application/json: { schema: { type: object, properties: { status: { type: string }, version: { type: string } } } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Unauthorized
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Forbidden — caller lacks the required scope
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    BadRequest:
      description: Bad request — validation failed
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ServiceUnavailable:
      description: Service unavailable — backing store could not be loaded
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
        detail: { type: object, nullable: true }

security:
  - bearerAuth: []

  /brief/generate:
    post:
      tags: [brief]
      summary: Generate a personalized brief
      description: Generates a personalized civic brief based on followed topics, institutions, and Bills.
      responses:
        '200':
          description: Generated brief
  /brief:
    get:
      tags: [brief]
      summary: Get today's civic brief
      description: Returns today's personalized civic brief, generated on-demand if not yet created.
      responses:
        '200':
          description: Today's brief
    post:
      tags: [brief]
      summary: Generate a personalized brief
      description: Generates a personalized civic brief based on followed topics, institutions, and Bills.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: string }
                followed_topics: { type: array, items: { type: string } }
                followed_institutions: { type: array, items: { type: string } }
                followed_bills: { type: array, items: { type: string } }
                country: { type: string }
      responses:
        '200':
          description: Generated brief
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /brief/today:
    get:
      tags: [brief]
      summary: Get today's brief
      responses:
        '200':
          description: Today's brief

  /brief/archive:
    get:
      tags: [brief]
      summary: List past briefs
      responses:
        '200':
          description: List of archived briefs

  /brief/digest:
    get:
      tags: [brief, notifications]
      summary: Get the past 24h digest of the caller's notifications
      description: |
        Returns the per-user daily digest payload — the same shape the
        email pipeline renders to HTML — covering the past 24 hours of
        the authenticated caller's notifications (issue #279). Used by
        the /notifications frontend to preview the email content
        without waiting for the daily cron.
        Sections are fixed: "Bills that changed stage",
        "New gazette notices matching your alerts", "Your MP's activity".
        Every item carries a non-empty link_url that deep-links back to
        the platform. The unsubscribe_url carries the user_id as a query
        parameter so the (future) /api/v1/subscriptions/unsubscribe
        endpoint can locate the user's follows without an auth header.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Today's digest
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: string }
                  email: { type: string, description: The caller's email claim, if present. }
                  headline: { type: string }
                  generated_at: { type: string, format: date-time }
                  since: { type: string, format: date-time }
                  until: { type: string, format: date-time }
                  total_items: { type: integer }
                  unsubscribe_url: { type: string, format: uri }
                  sections:
                    type: array
                    items:
                      type: object
                      properties:
                        title: { type: string }
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              title: { type: string }
                              description: { type: string }
                              link_url: { type: string, format: uri }
                              kind: { type: string }
                              date: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /brief/{id}:
    get:
      tags: [brief]
      summary: Get a specific brief by ID
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: The brief
        '404': { $ref: '#/components/responses/NotFound' }

  /compare:
    get:
      tags: [compare]
      summary: Compare countries across dimensions
      description: Cross-country civic comparison — government structure, legislation, debt, indicators. The platform does not rank countries.
      parameters:
        - { in: query, name: countries, required: false, schema: { type: string }, description: "Comma-separated country codes (KE,UG,TZ,GH,NG,ZA)" }
      responses:
        '200':
          description: Comparison data

  /compare/{id}:
    get:
      tags: [compare]
      summary: Get a specific comparison dimension
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Comparison data for the dimension
        '404': { $ref: '#/components/responses/NotFound' }

  /people:
    get:
      tags: [people]
      summary: List people (MPs, officials)
      responses:
        '200':
          description: List of civic persons

  /people/{id}:
    get:
      tags: [people]
      summary: Get a person by ID
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Person details
        '404': { $ref: '#/components/responses/NotFound' }

  /people/{id}/scorecard:
    get:
      tags: [people]
      summary: MP factual scorecard (no rankings)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: MP scorecard with factual records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MPScorecard'
        '404': { $ref: '#/components/responses/NotFound' }

  /people/{id}/bills:
    get:
      tags: [people, bills]
      summary: Bills sponsored by the given MP (issue #282)
      description: |
        Returns every Bill the seed slice attributes to the given MP
        (primary sponsor). Powers the scorecard page's "Bills
        Sponsored: N" clickable list.

        The endpoint is seed-only — the live kenya_law parser does NOT
        extract the sponsor from the Bill detail page (issue #282
        deliberately leaves sponsorship attribution to the seed slice
        pending a verified ingestion path through parliament.go.ke).

        When a verified ingestion path ships, this endpoint will be
        extended to merge live + seed results; until then, `source` is
        always `"seed"`.

        Each item carries the full `Bill` response shape (with the
        sponsor + cosponsors fields populated by `applySponsorFields`)
        so the frontend can render the same Bill card it uses on /bills.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string }, description: 'Platform-internal person ID (e.g. "person-001")' }
      responses:
        '200':
          description: List of Bills sponsored by the given MP
          content:
            application/json:
              schema:
                type: object
                properties:
                  person_id: { type: string, description: 'The requested MP\'s platform-internal person ID' }
                  name: { type: string, description: 'The requested MP\'s display name (looked up from sampleScorecards)' }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Bill' }
                  total: { type: integer }
                  source: { type: string, enum: [seed], description: 'Always "seed" — sponsor attribution is seed-only until a verified ingestion path ships (issue #282).' }
                  scorecard_url: { type: string, description: '/api/v1/people/{id}/scorecard URL — convenience echo so the frontend can link back to the MP\'s scorecard page' }
        '404': { $ref: '#/components/responses/NotFound', description: 'Returned when the person ID does not match a sample MP (the seed Bills slice is the only source of sponsor attribution).' }

  /constituencies:
    get:
      tags: [constituencies]
      summary: List constituencies/counties
      responses:
        '200':
          description: List of constituencies

  /constituencies/{id}:
    get:
      tags: [constituencies]
      summary: Constituency dashboard
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Constituency detail with civic data
        '404': { $ref: '#/components/responses/NotFound' }

  /calendar:
    get:
      tags: [calendar]
      summary: Civic calendar events
      parameters:
        - { in: query, name: month, required: false, schema: { type: string }, description: "YYYY-MM format" }
        - { in: query, name: country, required: false, schema: { type: string } }
      responses:
        '200':
          description: Calendar events

  /calendar/today:
    get:
      tags: [calendar]
      summary: Today's civic events
      responses:
        '200':
          description: Today's events

  /calendar/upcoming:
    get:
      tags: [calendar]
      summary: Upcoming civic events
      parameters:
        - { in: query, name: limit, required: false, schema: { type: integer } }
      responses:
        '200':
          description: Upcoming events

  /calendar/live:
    get:
      tags: [calendar]
      summary: Is parliament sitting right now? (issue #283)
      description: |
        Returns the live plenary status. When a `parliament_session` calendar
        event is scheduled for today, the response carries `is_live: true`
        plus the YouTube video URL of the live stream, a human-readable
        sitting title, and the house (e.g., "National Assembly") so the
        frontend can render a "🔴 Parliament is live — Watch now" banner
        and embed the YouTube player without a second round-trip.

        When parliament is not in session, the response is the minimal
        `{ "is_live": false }` payload — the frontend can short-circuit
        and skip the embed entirely.
      parameters:
        - { in: query, name: country, required: false, schema: { type: string }, description: "ISO 3166-1 alpha-2 country code (defaults to KE)" }
      responses:
        '200':
          description: Live plenary status
          content:
            application/json:
              schema:
                type: object
                required: [is_live]
                properties:
                  is_live: { type: boolean, description: "true when a parliament_session event is scheduled for today" }
                  video_url:
                    type: string
                    format: uri
                    description: "YouTube URL of the live stream — present iff is_live is true. Currently a placeholder; in production it would come from the Hansard crawl (HansardCandidate.VideoURL)."
                  title: { type: string, description: "Sitting title (e.g., 'National Assembly — Morning Sitting') — present iff is_live is true" }
                  house: { type: string, description: "Short house label (e.g., 'National Assembly', 'Senate') — present iff is_live is true" }
                  event_id: { type: string, description: "Calendar event ID of the in-session sitting — present iff is_live is true" }
                  date: { type: string, description: "YYYY-MM-DD of the sitting — present iff is_live is true" }

  /gazette/alerts:
    get:
      tags: [gazette]
      summary: List gazette keyword alerts
      responses:
        '200':
          description: List of alerts
    post:
      tags: [gazette]
      summary: Create a gazette keyword alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keywords: { type: array, items: { type: string } }
                user_id: { type: string }
      responses:
        '200':
          description: Created alert

  /gazette/alerts/{id}:
    delete:
      tags: [gazette]
      summary: Delete a gazette alert
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Deleted
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [gazette]
      summary: Get gazette notices matching an alert
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: Matching gazette notices
        '404': { $ref: '#/components/responses/NotFound' }

  # ---- RSS 2.0 feeds (issue #280) ----
  #
  # The four /feed/*.rss endpoints reuse the JSON handlers' data sources
  # but emit application/rss+xml so subscribers can follow Bills,
  # what-changed, the daily brief, and per-MP activity from Feedly /
  # Inoreader / NetNewsWire without creating an account. RSS 2.0 spec:
  # https://www.rssboard.org/rss-specification

  /feed/bills.rss:
    get:
      tags: [feed]
      summary: RSS 2.0 feed of the latest Bills
      description: |
        Returns the latest Bills before Kenya Parliament as RSS 2.0 XML.
        Reuses the same Kenya Law adapter (new.kenyalaw.org/bills/) as
        GET /bills — including the issue-#265 degraded-fallback contract:
        when the live crawl fails, the feed returns 200 with the seed
        Bills rather than 5xx, so RSS subscribers don't see their feed
        break during upstream outages.

        Each Bill becomes a single <item> whose <guid> is the Bill's
        stable SourceID (so RSS readers deduplicate across re-fetches
        even when the upstream slug changes) and whose <category> is
        the House (National Assembly vs Senate).
      responses:
        '200':
          description: RSS 2.0 XML feed of Bills
          content:
            application/rss+xml:
              schema:
                type: string
                description: RSS 2.0 XML document (<rss version="2.0">).

  /feed/what-changed.rss:
    get:
      tags: [feed, what-changed]
      summary: RSS 2.0 feed of verified civic changes
      description: |
        Returns the latest verified civic changes as RSS 2.0 XML. Mirrors
        the JSON /what-changed endpoint's data pipeline (DiscoverBills →
        ChangeItem) but emits RSS. Each item carries the change's
        significance (INFORMATIONAL / SUBSTANTIVE / HIGH_IMPACT) as the
        RSS <category> so subscribers can filter their feed reader by
        severity. Every item links to evidence.
      responses:
        '200':
          description: RSS 2.0 XML feed of verified civic changes
          content:
            application/rss+xml:
              schema:
                type: string
                description: RSS 2.0 XML document (<rss version="2.0">).

  /feed/brief.rss:
    get:
      tags: [feed, briefing]
      summary: RSS 2.0 feed of the latest Civic Daily Brief
      description: |
        Returns the latest generated Civic Daily Briefs as RSS 2.0 XML.
        The brief headline becomes the item title; the AI summary becomes
        the description; the deep link points to /briefing?id={briefID}.

        When the brief store is empty (e.g. before the day's first
        /brief/generate call), the feed renders with zero items so RSS
        readers see a valid but empty feed rather than a 5xx.
      responses:
        '200':
          description: RSS 2.0 XML feed of the Civic Daily Brief
          content:
            application/rss+xml:
              schema:
                type: string
                description: RSS 2.0 XML document (<rss version="2.0">).

  /feed/people/{id}.rss:
    get:
      tags: [feed, people]
      summary: RSS 2.0 feed of a single MP's activity
      description: |
        Returns the per-MP activity feed — Bills sponsored, speeches,
        votes, questions — sourced from the same sampleScorecards dataset
        the /api/v1/people/{id}/scorecard endpoint uses. Each activity
        becomes a single <item> whose <category> is the activity kind
        (bill_sponsored, vote, question, statement) so subscribers can
        filter their feed reader by activity type.

        The platform NEVER aggregates these into a political-performance
        score (rule: NO_POLITICAL_PERFORMANCE_SCORE) — the feed is a raw
        timeline of evidence-cited activity.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string }, description: Person ID (e.g. "person-001") }
      responses:
        '200':
          description: RSS 2.0 XML feed of the MP's activity
          content:
            application/rss+xml:
              schema:
                type: string
                description: RSS 2.0 XML document (<rss version="2.0">).
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
