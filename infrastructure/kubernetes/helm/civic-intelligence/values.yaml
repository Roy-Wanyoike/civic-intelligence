# Default values for civic-intelligence.
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: civic-intelligence
  tag: latest
  pullPolicy: IfNotPresent

services:
  api:
    enabled: true
    port: 9000
    env:
      DEV_MODE: "false"
      OIDC_ISSUER: "http://keycloak:8080/realms/civic"
  web:
    enabled: true
    port: 3000
  ai:
    enabled: true
    port: 8000

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: civic-intelligence.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# NetworkPolicy restricts API → DB and crawler egress
networkPolicy:
  enabled: true
  crawlerEgressAllowlist:
    - parliament.go.ke
    - kenyalaw.org
    - president.go.ke
    - treasury.go.ke

# PostgreSQL configuration
postgres:
  host: postgres
  port: 5432
  database: civic_intelligence
  username: civic
  existingSecret: postgres-credentials
  secretKey: password

# Redis
redis:
  host: redis
  port: 6379

# NATS
nats:
  url: nats://nats:4222
