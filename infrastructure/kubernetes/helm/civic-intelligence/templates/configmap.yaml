{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-{{ $name }}-config
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "civic.serviceLabels" (dict "root" $ "svc" $svc "name" $name) | nindent 4 }}
data:
  # Connection strings — service DNS resolved relative to the chart release.
  DATABASE_URL: "postgres://civic@{{ $.Release.Name }}-postgresql.{{ $.Release.Namespace }}.svc.cluster.local:5432/civic?sslmode=require"
  NATS_URL: "nats://{{ $.Release.Name }}-nats.{{ $.Release.Namespace }}.svc.cluster.local:4222"
  REDIS_URL: "redis://{{ $.Release.Name }}-redis-master.{{ $.Release.Namespace }}.svc.cluster.local:6379/0"
  S3_ENDPOINT: "http://{{ $.Release.Name }}-minio.{{ $.Release.Namespace }}.svc.cluster.local:9000"
  S3_BUCKET: "civic-raw-documents"
  OPENSEARCH_URL: "https://{{ $.Release.Name }}-opensearch.{{ $.Release.Namespace }}.svc.cluster.local:9200"
  TEMPORAL_ADDRESS: "{{ $.Release.Name }}-temporal.{{ $.Release.Namespace }}.svc.cluster.local:7233"
  KEYCLOAK_URL: "http://{{ $.Release.Name }}-keycloak.{{ $.Release.Namespace }}.svc.cluster.local:8080"
  KEYCLOAK_REALM: "civic"
  # Deployment-aware env values from the service definition.
  {{- range $k, $v := $svc.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
