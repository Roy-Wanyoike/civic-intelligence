{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "civic.serviceLabels" (dict "root" $ "svc" $svc "name" $name) | nindent 4 }}
spec:
  type: {{ $svc.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.service.port | default 8080 }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
