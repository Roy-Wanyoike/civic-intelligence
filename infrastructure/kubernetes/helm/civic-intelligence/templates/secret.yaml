{{/*
Secret template: rendered only when externalSecrets.enabled = false.
When externalSecrets.enabled = true, the ExternalSecret resource (below)
materializes these keys from AWS Secrets Manager / Vault instead.
*/}}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled (not $.Values.externalSecrets.enabled) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-{{ $name }}-secret
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "civic.serviceLabels" (dict "root" $ "svc" $svc "name" $name) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: "keep"
type: Opaque
# Placeholder data — overridable per env via --set or values override.
stringData:
  DATABASE_PASSWORD: "change-me"
  REDIS_PASSWORD: "change-me"
  S3_ACCESS_KEY: "change-me"
  S3_SECRET_KEY: "change-me"
  KEYCLOAK_CLIENT_SECRET: "change-me"
  LLM_API_KEY: "change-me"
{{- end }}
{{- end }}

{{- if .Values.externalSecrets.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: civic/{{ .Release.Namespace }}/database
        property: password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: civic/{{ .Release.Namespace }}/redis
        property: password
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: civic/{{ .Release.Namespace }}/s3
        property: access_key
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: civic/{{ .Release.Namespace }}/s3
        property: secret_key
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: civic/{{ .Release.Namespace }}/keycloak
        property: client_secret
    - secretKey: LLM_API_KEY
      remoteRef:
        key: civic/{{ .Release.Namespace }}/llm
        property: api_key
{{- end }}
